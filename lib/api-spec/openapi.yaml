openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Project PM API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project project operations
  - name: milestones
    description: Milestone operations
  - name: tasks
    description: Task operations
  - name: members
    description: Team member operations
  - name: comments
    description: Comment operations
  - name: dashboard
    description: Dashboard summary operations
  - name: documents
    description: Document operations
  - name: folders
    description: Document folder operations
  - name: call-sheets
    description: Per-project call sheet (crew list) operations
  - name: crew
    description: Crew invite and public availability-reply operations

paths:
  /projects/{projectId}/releases:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listProjectReleases
      responses:
        "200":
          description: Project releases
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReleaseRecord" } }
    post:
      operationId: createProjectRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRecord" }
  /releases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRecord" }
  /releases/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: archiveRelease
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ReleaseArchiveInput" }
      responses:
        "200":
          description: Signed PDF verified and archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRecord" }
  /releases/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: downloadRelease
      responses:
        "200":
          description: Protected signed PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /projects/{projectId}/wrike-link:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getProjectWrikeLink
      responses:
        "200":
          description: Link metadata; linking does not synchronize data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrikeLink" }
    put:
      operationId: setProjectWrikeLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WrikeLinkInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrikeLink" }
    delete:
      operationId: removeProjectWrikeLink
      responses:
        "204": { description: Unlinked locally; Wrike unchanged }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/transfer:
    post:
      operationId: transferProject
      tags: [projects]
      summary: Transfer ownership of a project to another user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectTransferInput"
      responses:
        "200":
          description: Project with updated ownerUserId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid recipient
        "403":
          description: Forbidden — not owner or admin
        "404":
          description: Not found

  /projects/{id}/progress:
    get:
      operationId: getProjectProgress
      tags: [projects]
      summary: Get completion breakdown for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProgress"

  # ── Milestones ────────────────────────────────────────────────────────────
  /projects/{projectId}/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List milestones for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Create a milestone
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /milestones/{id}:
    patch:
      operationId: updateMilestone
      tags: [milestones]
      summary: Update a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      summary: Delete a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Tasks ─────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks (optionally filtered by project or milestone)
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: milestoneId
          in: query
          schema:
            type: integer
        - name: assigneeId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: taskId
          in: query
          description: Filter tasks attached to a parent task (reserved, unused)
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{taskId}/notes:
    get:
      operationId: listTaskNotes
      tags: [tasks]
      summary: List notes (including status-change notes) for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskNote"
    post:
      operationId: createTaskNote
      tags: [tasks]
      summary: Add a note to a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskNote"

  /tasks/upcoming:
    get:
      operationId: listUpcomingTasks
      tags: [tasks]
      summary: Get tasks due in the next 14 days across all projects
      responses:
        "200":
          description: Upcoming tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  # ── Comments ─────────────────────────────────────────────────────────────
  /tasks/{taskId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Admin: Users (auth accounts) ─────────────────────────────────────────
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List all auth accounts (admin only)
      responses:
        "200":
          description: Auth accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Admin access required

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Promote / demote a local user (admin only). OIDC users cannot be promoted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Cannot demote yourself, or cannot promote an OIDC account
        "403":
          description: Admin access required
        "404":
          description: User not found
    delete:
      operationId: deleteAdminUser
      tags: [admin-users]
      summary: Delete an auth account (admin only). Cannot delete yourself.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete yourself
        "403":
          description: Admin access required
        "404":
          description: User not found

  # ── Team Members ─────────────────────────────────────────────────────────
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/invite:
    post:
      operationId: inviteMember
      tags: [members]
      summary: Email a sign-in invitation to a roster member (admin-only)
      description: |
        Sends a Cue-branded email with the sign-in URL to the member's address,
        and flips `preApproved` on so their first OIDC sign-in lands ACTIVE
        without admin approval. Requires SendGrid to be configured server-side.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invitation accepted by the email provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteMemberResult" }
        "400": { description: Member has no email address }
        "403": { description: Admin access required }
        "404": { description: Member not found }
        "429": { description: Too many invite emails — try again later }
        "502": { description: Email provider rejected the send }
        "503": { description: Email is not configured on this server }

  /members/{id}:
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Project Members ──────────────────────────────────────────────────────
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags: [project-members]
      summary: List members assigned to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
    post:
      operationId: addProjectMember
      tags: [project-members]
      summary: Assign an existing team member to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "404":
          description: Project or member not found
        "409":
          description: Member already assigned

  /projects/{projectId}/members/{memberId}:
    delete:
      operationId: removeProjectMember
      tags: [project-members]
      summary: Remove a member from a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  # ── Call Sheets ───────────────────────────────────────────────────────────
  /projects/{projectId}/call-sheets:
    get:
      operationId: listCallSheets
      tags: [call-sheets]
      summary: List call sheets for a project (newest shoot date first)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Call sheets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CallSheet" }
        "404": { description: Project not found }
    post:
      operationId: createCallSheet
      tags: [call-sheets]
      summary: Create a call sheet for a shoot day
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallSheetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallSheet" }
        "404": { description: Project not found }

  /call-sheets/{id}:
    get:
      operationId: getCallSheet
      tags: [call-sheets]
      summary: Get a call sheet with its crew lines
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Call sheet with crew
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallSheet" }
        "404": { description: Not found }
    patch:
      operationId: updateCallSheet
      tags: [call-sheets]
      summary: Update a call sheet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallSheetUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallSheet" }
        "404": { description: Not found }
    delete:
      operationId: deleteCallSheet
      tags: [call-sheets]
      summary: Delete a call sheet (and its crew lines)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /call-sheets/{id}/send:
    post:
      operationId: sendCallSheetInvites
      tags: [crew]
      summary: Email availability invites to all pending crew lines that have an email
      description: |
        Generates a public reply token for each eligible crew line (one with an
        email that hasn't responded yet) and emails them an availability link.
        Idempotent-ish: already-responded lines are skipped. Requires SendGrid.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invites dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewSendResult" }
        "404": { description: Call sheet not found }
        "503": { description: Email is not configured on this server }

  # ── Crew lines ────────────────────────────────────────────────────────────
  /call-sheets/{id}/crew:
    post:
      operationId: addCrewInvite
      tags: [crew]
      summary: Add a crew line to a call sheet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrewInviteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewInvite" }
        "404": { description: Call sheet not found }

  /crew/{id}:
    patch:
      operationId: updateCrewInvite
      tags: [crew]
      summary: Update a crew line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrewInviteUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewInvite" }
        "404": { description: Not found }
    delete:
      operationId: deleteCrewInvite
      tags: [crew]
      summary: Remove a crew line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /crew/{id}/send:
    post:
      operationId: sendCrewInvite
      tags: [crew]
      summary: Email (or re-email) the availability invite for a single crew line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invite dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewSendResult" }
        "400": { description: Crew line has no email address }
        "404": { description: Not found }
        "503": { description: Email is not configured on this server }

  # ── Public crew reply (NO AUTH) ───────────────────────────────────────────
  /crew/respond/{token}:
    get:
      operationId: getPublicCrewInvite
      tags: [crew]
      summary: Public — fetch the invite + shoot details for a reply token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public invite view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCrewInvite" }
        "404": { description: Invalid or expired link }
    post:
      operationId: respondCrewInvite
      tags: [crew]
      summary: Public — submit an availability response for a reply token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrewRespondInput" }
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCrewInvite" }
        "404": { description: Invalid or expired link }

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Global dashboard summary — project counts, task stats, upcoming deadlines
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Documents ─────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents (all, or filtered by project)
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: global
          in: query
          description: If true, return only global (non-project) documents
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
        - name: folderId
          in: query
          description: Filter to documents inside this folder (use 0 for root of the given scope)
          schema:
            type: integer
        - name: taskId
          in: query
          description: Filter to documents attached to a specific task
          schema:
            type: integer
        - name: includeTasks
          in: query
          description: When combined with projectId, also include documents attached to any task within that project.
          schema:
            type: boolean
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Folders ───────────────────────────────────────────────────────────────
  /folders:
    get:
      operationId: listFolders
      tags: [folders]
      summary: List document folders (optionally filtered by project)
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: global
          in: query
          description: If true, return only global (non-project) folders
          schema:
            type: boolean
        - name: taskId
          in: query
          description: Filter to folders attached to a specific task
          schema:
            type: integer
        - name: includeTasks
          in: query
          description: When combined with projectId, also include folders attached to any task within that project.
          schema:
            type: boolean
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentFolder"
    post:
      operationId: createFolder
      tags: [folders]
      summary: Create a document folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentFolderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"

  /folders/{id}:
    patch:
      operationId: updateFolder
      tags: [folders]
      summary: Rename or move a folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentFolderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"
    delete:
      operationId: deleteFolder
      tags: [folders]
      summary: Delete an empty folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Folder is not empty

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent activity feed across all projects
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  # ── Share links ─────────────────────────────────────────────────────────────
  /share-links:
    get:
      operationId: listShareLinks
      tags: [shares]
      summary: List share links for a given resource
      parameters:
        - in: query
          name: resourceType
          required: true
          schema: { type: string, enum: [project, task, document] }
        - in: query
          name: resourceId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Active and inactive links for the resource
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareLink" }
    post:
      operationId: createShareLink
      tags: [shares]
      summary: Create a new share link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }

  /share-links/{id}:
    delete:
      operationId: revokeShareLink
      tags: [shares]
      summary: Revoke a share link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Revoked }

  /share-links/{id}/email:
    post:
      operationId: emailShareLink
      tags: [shares]
      summary: Email an existing share link to one or more recipients
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkEmailInput" }
      responses:
        "200":
          description: Email accepted by the provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLinkEmailResult" }
        "400": { description: No valid recipients or link is revoked/expired }
        "404": { description: Share link not found }
        "503": { description: Email is not configured on this server }

  /public/shares/{token}:
    get:
      operationId: getPublicShare
      tags: [shares]
      summary: Public read-only view of a shared resource (no auth required)
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The shared resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        "404":
          description: Link not found, revoked, or expired

components:
  schemas:
    ReleaseInput:
      type: object
      required: [guestName, guestEmail, title, templateVersion, status]
      properties:
        guestName: { type: string, minLength: 1, maxLength: 200 }
        guestEmail: { type: string, format: email, maxLength: 320 }
        title: { type: string, minLength: 1, maxLength: 200 }
        templateVersion: { type: string, minLength: 1, maxLength: 100 }
        productionDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [draft, awaiting_signatures, signed] }
        notes: { type: string, maxLength: 5000 }
    ReleaseArchiveInput:
      type: object
      required: [file, confirmed]
      properties:
        file: { type: string, format: binary }
        confirmed: { type: string, enum: ["true"], description: Producer confirms all required signatures are present }
    ReleaseRecord:
      type: object
      required: [id, projectId, guestName, guestEmail, title, templateVersion, status, notes, createdAt, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        guestName: { type: string }
        guestEmail: { type: string }
        title: { type: string }
        templateVersion: { type: string }
        productionDate: { type: ["string", "null"] }
        status: { type: string, enum: [draft, awaiting_signatures, signed, archived] }
        notes: { type: string }
        fileName: { type: ["string", "null"] }
        sha256: { type: ["string", "null"] }
        archivedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    WrikeLinkInput:
      type: object
      required: [remoteId, url]
      properties:
        remoteId: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2000 }
    WrikeLink:
      type: object
      required: [projectId, linked, syncStatus]
      properties:
        projectId: { type: integer }
        linked: { type: boolean }
        remoteId: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        syncStatus: { type: string, enum: [not_configured] }
        updatedAt: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Project ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        description:    { type: ["string", "null"] }
        location:       { type: ["string", "null"] }
        status:         { type: string, enum: [planning, in_progress, on_hold, completed] }
        phase:          { type: ["string", "null"] }
        startDate:      { type: ["string", "null"] }
        targetDate:     { type: ["string", "null"] }
        completedDate:  { type: ["string", "null"] }
        budget:         { type: ["number", "null"] }
        ownerUserId:    { type: ["integer", "null"], description: "Owner user id. Null means unowned (admin-only operations)." }
        createdAt:      { type: string }
        updatedAt:      { type: string }

    ProjectTransferInput:
      type: object
      required: [newOwnerUserId]
      properties:
        newOwnerUserId:
          type: ["integer", "null"]
          description: "New owner user id, or null to clear the owner (admin-only)."

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:           { type: string, minLength: 1 }
        description:    { type: string }
        location:       { type: string }
        status:         { type: string, enum: [planning, in_progress, on_hold, completed] }
        phase:          { type: string }
        startDate:      { type: string }
        targetDate:     { type: string }
        budget:         { type: number }

    ProjectUpdate:
      type: object
      properties:
        name:           { type: string, minLength: 1 }
        description:    { type: string }
        location:       { type: string }
        status:         { type: string, enum: [planning, in_progress, on_hold, completed] }
        phase:          { type: string }
        startDate:      { type: string }
        targetDate:     { type: string }
        completedDate:  { type: string }
        budget:         { type: number }

    ShareLinkEmailInput:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: array
          minItems: 1
          items: { type: string }
          description: Email addresses to send the share link to.
        message:
          type: string
          maxLength: 2000
          description: Optional personal note included in the email body.

    ShareLinkEmailResult:
      type: object
      required: [sent, recipients]
      properties:
        sent: { type: integer }
        recipients:
          type: array
          items: { type: string }

    ShareLinkInput:
      type: object
      required: [resourceType, resourceId]
      properties:
        resourceType:
          type: string
          enum: [project, task, document]
        resourceId: { type: integer }
        expiresAt:
          type: string
          description: ISO timestamp. Omit for no expiry.

    ShareLink:
      type: object
      required: [id, token, resourceType, resourceId, url, createdAt, active]
      properties:
        id:           { type: integer }
        token:        { type: string }
        resourceType: { type: string, enum: [project, task, document] }
        resourceId:   { type: integer }
        url:          { type: string, description: "Absolute URL to the public share page." }
        createdBy:    { type: integer }
        createdAt:    { type: string }
        expiresAt:    { type: string }
        revokedAt:    { type: string }
        active:       { type: boolean }

    PublicShare:
      type: object
      required: [resourceType, resourceId, createdAt]
      properties:
        resourceType: { type: string, enum: [project, task, document] }
        resourceId:   { type: integer }
        createdAt:    { type: string }
        expiresAt:    { type: string }
        project:      { $ref: "#/components/schemas/Project" }
        task:         { $ref: "#/components/schemas/Task" }
        document:     { $ref: "#/components/schemas/Document" }
        projectName:  { type: string, description: "Name of the project this resource belongs to, if any." }
        # For project shares: the project's children so the public page can
        # show a dashboard-like view (milestones, tasks, documents).
        milestones:
          type: array
          items: { $ref: "#/components/schemas/Milestone" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        folders:
          type: array
          items: { $ref: "#/components/schemas/DocumentFolder" }
        team:
          type: array
          description: "Members assigned to the shared project. Email withheld in the public payload."
          items:
            type: object
            required: [memberId, name, role]
            properties:
              memberId:    { type: integer }
              name:        { type: string }
              role:        { type: string }
              projectRole: { type: string }
              department:  { type: string }
              avatarUrl:   { type: string }
        # For document shares: an absolute URL the public page can use to fetch
        # the file content (streams through the public file endpoint).
        fileUrl:      { type: string }
        fileMimeType: { type: string }

    ProjectProgress:
      type: object
      required: [projectId, totalTasks, completedTasks, overdueTasks, totalMilestones, completedMilestones, percentComplete, taskPercentComplete, milestonePercentComplete, byCategory]
      properties:
        projectId:                 { type: integer }
        totalTasks:                { type: integer }
        completedTasks:            { type: integer }
        overdueTasks:              { type: integer }
        totalMilestones:           { type: integer }
        completedMilestones:       { type: integer }
        percentComplete:           { type: number, description: "Blended completion across tasks and milestones (weighted by item count)." }
        taskPercentComplete:       { type: number }
        milestonePercentComplete:  { type: number }
        byCategory:
          type: array
          items:
            type: object
            required: [category, total, completed]
            properties:
              category:  { type: string }
              total:     { type: integer }
              completed: { type: integer }

    # ── Milestone ───────────────────────────────────────────────────────────
    Milestone:
      type: object
      required: [id, projectId, name, status, createdAt]
      properties:
        id:          { type: integer }
        projectId:    { type: integer }
        name:        { type: string }
        description: { type: ["string", "null"] }
        dueDate:     { type: ["string", "null"] }
        status:      { type: string, enum: [pending, in_progress, completed, missed] }
        color:       { type: ["string", "null"] }
        createdAt:   { type: string }

    MilestoneInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
        dueDate:     { type: string }
        status:      { type: string, enum: [pending, in_progress, completed, missed] }
        color:       { type: string }

    MilestoneUpdate:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }
        dueDate:     { type: string }
        status:      { type: string, enum: [pending, in_progress, completed, missed] }
        color:       { type: string }

    # ── Task ────────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, projectId, title, status, priority, category, createdAt]
      properties:
        id:          { type: integer }
        projectId:    { type: integer }
        milestoneId: { type: ["integer", "null"] }
        assigneeId:  { type: ["integer", "null"] }
        title:       { type: string }
        description: { type: ["string", "null"] }
        status:      { type: string, enum: [todo, in_progress, blocked, review, done] }
        priority:    { type: string, enum: [low, medium, high, critical] }
        category:    { type: string, enum: [construction, electrical, av, it, network, acoustics, furnishing, signage, general] }
        dueDate:     { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        createdAt:   { type: string }
        updatedAt:   { type: string }
        # Joined fields
        assigneeName:   { type: ["string", "null"] }
        projectName:     { type: ["string", "null"] }
        milestoneName:  { type: ["string", "null"] }

    TaskInput:
      type: object
      required: [projectId, title, status, priority, category]
      properties:
        projectId:    { type: integer }
        milestoneId: { type: integer }
        assigneeId:  { type: integer }
        title:       { type: string, minLength: 1 }
        description: { type: string }
        status:      { type: string, enum: [todo, in_progress, blocked, review, done] }
        priority:    { type: string, enum: [low, medium, high, critical] }
        category:    { type: string, enum: [construction, electrical, av, it, network, acoustics, furnishing, signage, general] }
        dueDate:     { type: string }

    TaskUpdate:
      type: object
      properties:
        milestoneId: { type: integer }
        assigneeId:  { type: integer }
        title:       { type: string }
        description: { type: string }
        status:      { type: string, enum: [todo, in_progress, blocked, review, done] }
        priority:    { type: string, enum: [low, medium, high, critical] }
        category:    { type: string, enum: [construction, electrical, av, it, network, acoustics, furnishing, signage, general] }
        dueDate:     { type: string }
        completedAt: { type: string }
        note:        { type: string, description: "Optional note recorded with the change. When status changes, this becomes a status-change note." }
        noteAuthorName: { type: string }

    TaskNote:
      type: object
      required: [id, taskId, body, createdAt]
      properties:
        id:           { type: integer }
        taskId:       { type: integer }
        authorId:     { type: ["integer", "null"] }
        authorName:   { type: ["string", "null"] }
        body:         { type: string }
        statusBefore: { type: ["string", "null"] }
        statusAfter:  { type: ["string", "null"] }
        createdAt:    { type: string }

    TaskNoteInput:
      type: object
      required: [body]
      properties:
        body:         { type: string, minLength: 1 }
        authorName:   { type: string }
        authorId:     { type: integer }

    # ── Comment ─────────────────────────────────────────────────────────────
    Comment:
      type: object
      required: [id, taskId, content, authorName, createdAt]
      properties:
        id:         { type: integer }
        taskId:     { type: integer }
        authorId:   { type: ["integer", "null"] }
        authorName: { type: string }
        content:    { type: string }
        createdAt:  { type: string }

    CommentInput:
      type: object
      required: [content, authorName]
      properties:
        authorId:   { type: integer }
        authorName: { type: string, minLength: 1 }
        content:    { type: string, minLength: 1 }

    # ── Admin User (auth account) ───────────────────────────────────────────
    AdminUser:
      type: object
      required: [id, isAdmin, isActive, authProvider, createdAt, lastLoginAt]
      properties:
        id:           { type: integer }
        email:        { type: ["string", "null"] }
        name:         { type: ["string", "null"] }
        picture:      { type: ["string", "null"] }
        isAdmin:      { type: boolean }
        isActive:     { type: boolean, description: "When false, the user cannot sign in or make any API call. New OIDC sign-ins land inactive and must be approved by an admin. Local accounts default to active." }
        authProvider: { type: string, enum: [local, oidc], description: "`local` = email/password, `oidc` = signed in via an external IdP (Authentik or Google). Only local users can be admins." }
        createdAt:    { type: string }
        lastLoginAt:  { type: string }

    AdminUserUpdate:
      type: object
      description: "Partial update of an auth account. All fields optional. `password` resets the user's password and is only valid for local accounts."
      properties:
        isAdmin:  { type: boolean }
        isActive: { type: boolean, description: "Approve (true) or suspend (false) the account. You can't deactivate your own account." }
        name:     { type: ["string", "null"] }
        email:    { type: ["string", "null"], format: email }
        password: { type: string, minLength: 8, description: "Admin-initiated password reset for a local account. Not allowed on OIDC accounts." }

    # ── Member ──────────────────────────────────────────────────────────────
    Member:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        email:        { type: ["string", "null"] }
        role:         { type: string, enum: [producer, engineer, it, integrator, manager, contractor] }
        department:   { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        title:        { type: ["string", "null"], description: "Job title, e.g. 'Senior AV Engineer'." }
        phone:        { type: ["string", "null"], description: "Office or main phone." }
        mobilePhone:  { type: ["string", "null"] }
        location:     { type: ["string", "null"], description: "City, timezone, or site assignment." }
        company:      { type: ["string", "null"], description: "External company, for contractors/integrators." }
        notes:        { type: ["string", "null"] }
        fullDayRate:  { type: ["integer", "null"], minimum: 0, description: "Standard full-day crew rate in whole dollars. Pre-fills a crew invite's rate." }
        halfDayRate:  { type: ["integer", "null"], minimum: 0, description: "Standard half-day crew rate in whole dollars." }
        preApproved:  { type: boolean, description: "When true, an OIDC sign-in matching this member's email lands ACTIVE — skips the admin-must-approve step on /admin/users. The user still has to verify their email (via Cue or the IdP) before signing in." }
        createdAt:    { type: string }

    MemberInput:
      type: object
      required: [name, role]
      properties:
        name:         { type: string, minLength: 1 }
        email:        { type: string }
        role:         { type: string, enum: [producer, engineer, it, integrator, manager, contractor] }
        department:   { type: string }
        avatarUrl:    { type: string }
        title:        { type: string }
        phone:        { type: string }
        mobilePhone:  { type: string }
        location:     { type: string }
        company:      { type: string }
        notes:        { type: string }
        fullDayRate:  { type: integer, minimum: 0, description: "Standard full-day crew rate in whole dollars." }
        halfDayRate:  { type: integer, minimum: 0, description: "Standard half-day crew rate in whole dollars." }
        preApproved:  { type: boolean, description: "Pre-approve this member so their first OIDC sign-in (after email verification) lands ACTIVE, no admin approval needed." }

    MemberUpdate:
      type: object
      description: "Partial update. Send `null` for an optional field to clear it; omit to leave unchanged."
      properties:
        name:         { type: string }
        role:         { type: string, enum: [producer, engineer, it, integrator, manager, contractor] }
        email:        { type: ["string", "null"] }
        department:   { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        title:        { type: ["string", "null"] }
        phone:        { type: ["string", "null"] }
        mobilePhone:  { type: ["string", "null"] }
        location:     { type: ["string", "null"] }
        company:      { type: ["string", "null"] }
        notes:        { type: ["string", "null"] }
        fullDayRate:  { type: ["integer", "null"], minimum: 0 }
        halfDayRate:  { type: ["integer", "null"], minimum: 0 }
        preApproved:  { type: boolean, description: "Only affects users who have NOT yet signed in. Flipping this on existing OIDC users does NOT retroactively activate them — use PATCH /api/admin/users/:id for that." }

    InviteMemberResult:
      type: object
      required: [sent, email, preApproved]
      properties:
        sent:        { type: boolean, description: "Whether the email provider accepted the send." }
        email:       { type: string, description: "The address the invite was dispatched to (lowercased)." }
        preApproved: { type: boolean, description: "Echoes the member's preApproved flag after the call — always true on success." }

    # ── Project Member ──────────────────────────────────────────────────────
    ProjectMember:
      type: object
      required: [id, projectId, memberId, name, role, createdAt]
      properties:
        id:           { type: integer }
        projectId:    { type: integer }
        memberId:     { type: integer }
        projectRole:  { type: ["string", "null"] }
        createdAt:    { type: string }
        name:         { type: string }
        email:        { type: ["string", "null"] }
        role:         { type: string }
        department:   { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }

    AddProjectMemberInput:
      type: object
      required: [memberId]
      properties:
        memberId:    { type: integer }
        projectRole: { type: string }

    # ── Call Sheets / Crew ───────────────────────────────────────────────────
    CallSheet:
      type: object
      required: [id, projectId, date, status, createdAt]
      properties:
        id:          { type: integer }
        projectId:   { type: integer }
        title:       { type: ["string", "null"], description: "Override for the printed header; falls back to the project name." }
        date:        { type: string, description: "Shoot date, YYYY-MM-DD." }
        callTime:    { type: ["string", "null"], description: "Free text, e.g. '11:00am'." }
        wrapTime:    { type: ["string", "null"] }
        location:    { type: ["string", "null"], description: "Studio(s), e.g. 'The Plex Studios - STUDIO E'." }
        billingNote: { type: ["string", "null"], description: "Billing banner, e.g. 'BILLING IS A HALF DAY RATE FOR ALL CREW'." }
        notes:       { type: ["string", "null"] }
        status:      { type: string, enum: [draft, sent, final] }
        createdBy:   { type: ["integer", "null"] }
        createdAt:   { type: string }
        updatedAt:   { type: string }
        crew:
          type: array
          description: "Crew lines on this sheet. Present on detail responses."
          items: { $ref: "#/components/schemas/CrewInvite" }

    CallSheetInput:
      type: object
      required: [date]
      properties:
        title:       { type: string }
        date:        { type: string, description: "Shoot date, YYYY-MM-DD." }
        callTime:    { type: string }
        wrapTime:    { type: string }
        location:    { type: string }
        billingNote: { type: string }
        notes:       { type: string }
        status:      { type: string, enum: [draft, sent, final] }

    CallSheetUpdate:
      type: object
      description: "Partial update. Send `null` to clear an optional field; omit to leave unchanged."
      properties:
        title:       { type: ["string", "null"] }
        date:        { type: string }
        callTime:    { type: ["string", "null"] }
        wrapTime:    { type: ["string", "null"] }
        location:    { type: ["string", "null"] }
        billingNote: { type: ["string", "null"] }
        notes:       { type: ["string", "null"] }
        status:      { type: string, enum: [draft, sent, final] }

    CrewInvite:
      type: object
      required: [id, callSheetId, position, name, rateType, status, createdAt]
      properties:
        id:           { type: integer }
        callSheetId:  { type: integer }
        position:     { type: string, description: "Role on the shoot, e.g. 'Camera Operator'." }
        memberId:     { type: ["integer", "null"], description: "Roster member, or null for an ad-hoc freelancer." }
        name:         { type: string }
        email:        { type: ["string", "null"] }
        rateType:     { type: string, enum: [full, half] }
        dayRate:      { type: ["integer", "null"], minimum: 0, description: "Day rate in whole dollars for this booking." }
        status:       { type: string, enum: [pending, invited, available, unavailable, confirmed] }
        responseNote: { type: ["string", "null"] }
        invitedAt:    { type: ["string", "null"] }
        respondedAt:  { type: ["string", "null"] }
        createdAt:    { type: string }

    CrewInviteInput:
      type: object
      required: [position, name]
      properties:
        position:  { type: string, minLength: 1 }
        memberId:  { type: integer, description: "When set, name/email/rates are pre-filled from the member if omitted." }
        name:      { type: string }
        email:     { type: string }
        rateType:  { type: string, enum: [full, half] }
        dayRate:   { type: integer, minimum: 0 }

    CrewInviteUpdate:
      type: object
      description: "Partial update of a crew line. Send `null` to clear an optional field."
      properties:
        position:  { type: string, minLength: 1 }
        memberId:  { type: ["integer", "null"] }
        name:      { type: string }
        email:     { type: ["string", "null"] }
        rateType:  { type: string, enum: [full, half] }
        dayRate:   { type: ["integer", "null"], minimum: 0 }
        status:    { type: string, enum: [pending, invited, available, unavailable, confirmed] }

    CrewSendResult:
      type: object
      required: [sent, total]
      properties:
        sent:  { type: integer, description: "How many invite emails the provider accepted." }
        total: { type: integer, description: "How many crew lines were eligible (have an email)." }

    # Public, no-login view of a single crew invite resolved by token.
    PublicCrewInvite:
      type: object
      required: [position, name, rateType, status, projectName, date]
      properties:
        position:    { type: string }
        name:        { type: string }
        rateType:    { type: string, enum: [full, half] }
        dayRate:     { type: ["integer", "null"], minimum: 0 }
        status:      { type: string, enum: [pending, invited, available, unavailable, confirmed] }
        responseNote: { type: ["string", "null"] }
        projectName: { type: string }
        title:       { type: ["string", "null"] }
        date:        { type: string }
        callTime:    { type: ["string", "null"] }
        wrapTime:    { type: ["string", "null"] }
        location:    { type: ["string", "null"] }

    CrewRespondInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, enum: [available, unavailable] }
        note:   { type: string, maxLength: 2000, description: "Optional note from the invitee." }

    # ── Dashboard ────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalProjects, activeProjects, totalTasks, completedTasks, overdueTasks, upcomingDeadlines, tasksByStatus, tasksByCategory]
      properties:
        totalProjects:       { type: integer }
        activeProjects:      { type: integer }
        totalTasks:         { type: integer }
        completedTasks:     { type: integer }
        overdueTasks:       { type: integer }
        upcomingDeadlines:
          type: array
          items:
            type: object
            required: [type, id, name, dueDate, projectName]
            properties:
              type:       { type: string, enum: [milestone, task] }
              id:         { type: integer }
              name:       { type: string }
              dueDate:    { type: string }
              projectName: { type: string }
              projectId:   { type: integer }
        tasksByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count:  { type: integer }
        tasksByCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category: { type: string }
              count:    { type: integer }

    # ── Document ─────────────────────────────────────────────────────────────
    Document:
      type: object
      required: [id, title, category, createdAt]
      properties:
        id:          { type: integer }
        projectId:    { type: ["integer", "null"] }
        projectName:  { type: ["string", "null"] }
        taskId:      { type: ["integer", "null"] }
        folderId:    { type: ["integer", "null"] }
        title:       { type: string }
        description: { type: ["string", "null"] }
        url:         { type: ["string", "null"] }
        notes:       { type: ["string", "null"] }
        category:    { type: string, enum: [spec, plan, permit, vendor, as_built, safety, general] }
        uploadedBy:  { type: ["string", "null"] }
        version:     { type: ["string", "null"] }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    DocumentInput:
      type: object
      required: [title, category]
      properties:
        projectId:    { type: integer }
        taskId:      { type: integer }
        folderId:    { type: integer }
        title:       { type: string, minLength: 1 }
        description: { type: string }
        url:         { type: string }
        notes:       { type: string }
        category:    { type: string, enum: [spec, plan, permit, vendor, as_built, safety, general] }
        uploadedBy:  { type: string }
        version:     { type: string }

    DocumentUpdate:
      type: object
      properties:
        projectId:    { type: integer }
        taskId:      { type: ["integer", "null"] }
        folderId:    { type: ["integer", "null"] }
        title:       { type: string }
        description: { type: string }
        url:         { type: string }
        notes:       { type: string }
        category:    { type: string, enum: [spec, plan, permit, vendor, as_built, safety, general] }
        uploadedBy:  { type: string }
        version:     { type: string }

    DocumentFolder:
      type: object
      required: [id, name, createdAt]
      properties:
        id:        { type: integer }
        projectId: { type: ["integer", "null"] }
        taskId:    { type: ["integer", "null"] }
        parentId:  { type: ["integer", "null"] }
        name:      { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    DocumentFolderInput:
      type: object
      required: [name]
      properties:
        projectId: { type: integer }
        taskId:    { type: integer }
        parentId:  { type: integer }
        name:      { type: string, minLength: 1 }

    DocumentFolderUpdate:
      type: object
      properties:
        name:     { type: string, minLength: 1 }
        parentId: { type: ["integer", "null"] }

    ActivityEntry:
      type: object
      required: [id, type, message, projectId, projectName, createdAt]
      properties:
        id:         { type: integer }
        type:       { type: string, enum: [task_created, task_updated, task_completed, milestone_completed, comment_added, project_created] }
        message:    { type: string }
        projectId:   { type: integer }
        projectName: { type: string }
        entityId:   { type: ["integer", "null"] }
        entityName: { type: ["string", "null"] }
        actorName:  { type: ["string", "null"] }
        createdAt:  { type: string }
